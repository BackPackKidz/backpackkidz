name: Temporary repository identity reconciliation
on:
  push:
    branches:
      - fix/repository-identity-transfer
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-identity-transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify repository identity and apply bounded replacements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          old = 'BackPackKidz/backpackkidz'
          new = 'matthewart100-sys/backpackkidz'
          escaped_old = r'BackPackKidz\/backpackkidz'
          escaped_new = r'matthewart100-sys\/backpackkidz'
          request = urllib.request.Request('https://api.github.com/repos/' + new, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              repo = json.load(response)
          assert repo['id'] == 1264408024, repo['id']
          assert repo['full_name'] == new, repo['full_name']
          expected = {
              'scripts/partner-logo-contract.mjs': 2,
              'scripts/partner-logo.mjs': 1,
              'publication/partner-logo-main-protection-proposal.json': 1,
              'tests/partner-logo-contract.test.mjs': 3,
              'scripts/publication-contract.mjs': 1,
              'scripts/governed-publication.mjs': 1,
              'publication/proposal.schema.json': 2,
          }
          for name, minimum in expected.items():
              path = pathlib.Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old) + text.count(escaped_old)
              assert count >= minimum, (name, count, minimum)
              text = text.replace(old, new).replace(escaped_old, escaped_new)
              assert old not in text and escaped_old not in text, name
              path.write_text(text, encoding='utf-8', newline='\n')
          proposal = json.loads(pathlib.Path('publication/partner-logo-main-protection-proposal.json').read_text())
          assert proposal['repository'] == new
          assert proposal['applied'] is False and proposal['authorization_required'] is True
          governed = [pathlib.Path('scripts'), pathlib.Path('publication'), pathlib.Path('tests')]
          leftovers = []
          for root in governed:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text or escaped_old in text:
                      leftovers.append(str(path))
          assert not leftovers, leftovers
          PY
          expected_files=$(printf '%s\n' \
            publication/partner-logo-main-protection-proposal.json \
            publication/proposal.schema.json \
            scripts/governed-publication.mjs \
            scripts/partner-logo-contract.mjs \
            scripts/partner-logo.mjs \
            scripts/publication-contract.mjs \
            tests/partner-logo-contract.test.mjs | sort)
          test "$(git diff --name-only | sort)" = "$expected_files"
          git diff --check
      - name: Install and validate
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          node --test tests/partner-logo-contract.test.mjs tests/partner-logo-browser.test.mjs
          npm audit
      - name: Commit only the bounded correction
        run: |
          git rm .github/workflows/tmp-repository-identity-reconcile.yml
          git config user.name 'BONSaAI bounded reconciliation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication/partner-logo-main-protection-proposal.json publication/proposal.schema.json scripts/governed-publication.mjs scripts/partner-logo-contract.mjs scripts/partner-logo.mjs scripts/publication-contract.mjs tests/partner-logo-contract.test.mjs
          expected_files=$(printf '%s\n' \
            .github/workflows/tmp-repository-identity-reconcile.yml \
            publication/partner-logo-main-protection-proposal.json \
            publication/proposal.schema.json \
            scripts/governed-publication.mjs \
            scripts/partner-logo-contract.mjs \
            scripts/partner-logo.mjs \
            scripts/publication-contract.mjs \
            tests/partner-logo-contract.test.mjs | sort)
          test "$(git diff --cached --name-only | sort)" = "$expected_files"
          git commit -m 'fix: bind partner-logo pilot to transferred repository identity'
          git push origin HEAD:fix/repository-identity-transfer
