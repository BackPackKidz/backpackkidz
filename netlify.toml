[build]
  base = "BackPackKidzWebsite"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"[build]
  command = "npm run build"
  publish = "BackPackKidzWebsite"
  functions = "netlify/functions"

[dev]
  publish = "BackPackKidzWebsite"
  functions = "netlify/functions"
